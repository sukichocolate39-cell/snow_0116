<body>
    <div id="msg"></div>
    <script>
        // for 計數迴圈
        // let msg = document.getElementById('msg');
        // for( let i = 1; i <= 1000; i+=10 ) {
        //     msg.innerHTML += i + '<br>';

        // 陣列和迴圈搭配使用
        let scores = [ 78, 90, 100, 44, 56, 34, 77, 82, 65, 90, 96, 87, 44, 56, 75, 82, 84, 80, 97, 90, 91, 56, 66, 67, 75, 80, 70, 34]
        // for( let i = 0; i<scores.length; i++) {
        //     msg.innerHTML += `scores[${i}] = ${scores[i]} <br>`
        // }

        // for/in 迴圈, 類似 for each, 只是抓的是索引值
        scores.sort(function(a, b) {return a - b });
        // (function(a, b) {return a - b }) 強制設定，讓陣列中的值由小到大，可以避免被判定成文字的無法正常排序
        // for( let i in scores) {
        //     msg.innerHTML += `分數[${i}] = ${scores[i]} <br>`
        // }

        // while 迴圈，計數器必須要事先宣告
        let i = 0;
        // while(i < scores.length) {
        //     msg.innerHTML += `s[${i}] = ${scores[i]} <br>`;
        //     i++
        // }

        // do/while 迴圈，先 do 跑完再 while 判斷
        do {
            msg.innerHTML += `ss[${i}] = ${scores[i]} <br>`;
            i++;
        } while (scores[i] < 10);
    </script>
