<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- DOM tree -->
    <div id="card">
        <h1 class="red">Title</h1>
        <img src="https://picsum.photos/150/100" alt="Placeholder Image">
        <p class="red">This is a paragraph.</p>
        <p>This is a paragraph.</p>
        <p class="red">This is a paragraph.</p>
    </div>
    <script>
        let card = document.getElementById("card");
        card.style.color = "blue";
        let p = document.getElementsByTagName("p");
        p[0].style.fontSize = "24px";
        p[1].style.fontWeight = "bold"; 
        let p1 = document.getElementsByClassName("red");
        p1[0].style.fontStyle = "italic";
        p1[0].innerText = "Card Title";
        p1[2].innerHTML = "<small>This is a important paragraph.<small>"
    </script>
</body>

</html>
