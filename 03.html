<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>表格 table</h1>
    <h2>tr 代表一列一列，裡面有幾格，th標體儲存格，粗體字且字至中，td一般儲存格文字靠左不加粗</h2>
    <table border="1px" cellpadding="5px" cellspacing="0px" align="center">
        <tr>
            <th>姓名</th>
            <th>年龄</th>
            <th>性别</th>
        </tr>
        <tr>
            <td>张三</td>
            <td>18</td>
            <td>男</td>
        </tr>
        <tr>
            <td>李四</td>
            <td>20</td>
            <td>女</td>
        </tr>
    </table>
</body>
</html>
