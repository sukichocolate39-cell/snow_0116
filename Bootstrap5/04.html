<!-- Modal Body -->
<!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
<div class="modal fade" id="modalId" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog"
    aria-labelledby="modalTitleId" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitleId">
                    電影介紹
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">1895年，日本近衛軍團自東北角登陸，準備接收台灣，台灣士紳紛紛召募義勇軍積極備戰。黃賢妹（楊謹華）曾遭土匪擄去，後雖平安歸來，卻沒人相信她的清白。秀才吳湯興（温昇豪）不顧流言依約娶了她，信任與愛令她銘感在心。為了抗日，吳湯興組成義民軍，起初雖屢戰屢捷，後來卻不幸失利，陷入苦戰</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Close
                </button>
                <!-- 要在自己寫功能進去 <button type="button" class="btn btn-primary">Save</button> -->
            </div>
        </div>
    </div>
