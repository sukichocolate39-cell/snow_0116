<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        .active {
            color: red;
        }
    </style>
</head>

<body>
    <h1>jQuery</h1>
    <h2>互動表單</h2>
    <p>請輸入你喜歡的運動</p>
    <input type="text" name="" id="item">
    <button id="addPrepend">增加在前</button>
    <button id="addAppend">增加在後</button>
    <button id="addAfter">框外，增加在後</button>
    <button id="addBefore">框外，增加在前</button>
    <br><br>
    <button id="clear">清空</button>
    <button id="addImage">新增圖片</button>
    <button id="removeImage">刪除圖片</button>
    <button id="hide">隱藏sport</button>
    <button id="show">顯示sport</button>
    <button id="toggle">切換顯示/隱藏</button>
    <button id="fadeToggle">淡入/淡出</button>
    <button id="slideToggle">滑入/滑出</button>
    <button id="animate">動畫</button>

    <ul id="sport">
        <li>111</li>
        <li>222</li>
        <li>333</li>
        <li>444</li>
        <li>555</li>
    </ul>

    <p id="text">12345678</p>

    <img alt="Placeholder Image">

    <ul id="sport"></ul>
    <script>
        $(function () {
            $('#addPrepend').click(function () {
                let sport = $('#item').val();
                $('#sport').prepend('<li>' + sport + '</li>');
                $('#item').val('');
            })
            $('#addAppend').click(function () {
                let sport = $('#item').val();
                $('#sport').append('<li>' + sport + '</li>');
                $('#item').val('');
            })
            $('#addBefore').click(function () {
                let sport = $('#item').val();
                $('#sport').before('<li>' + sport + '</li>');
                $('#item').val('');
            })
            $('#addAfter').click(function () {
                let sport = $('#item').val();
                $('#sport').after('<li>' + sport + '</li>');
                $('#item').val('');
            })
            $('#clear').click(function () {
                $('#sport').empty();
            })
            // .click 只適用於網頁載入時已存在的元素，後面動態新增的元素，無法有事件
            // $('#sport li').click(function(){
            //     $(this).remove();
            // })

            // // .on 可以適用網頁載入的元素，也適用新增的元素
            // $('#sport').on('click', 'li', function () {
            //     $('#sport').empty();
            // })

            $('#sport').on('click', 'li', function () {
                // 將所有的 li 的 active 移除
                $('#sport li').removeClass('active');
                $(this).addClass('active');
            })

            $('#addImage').click(function () {
                $('img').attr('src', "https://picsum.photos/200/240");
            })
            $('#removeImage').click(function () {
                $('img').removeAttr('src');
            })
            $('#hide').click(function () {
                $('#sport').hide(1000);
            })
            $('#show').click(function () {
                $('#sport').show(1000);
            })
            $('#toggle').click(function () {
                $('#sport').toggle(1000);
            })
            $('#fadeToggle').click(function () {
                $('#sport').fadeToggle(1000);
            })
            $('#slideToggle').click(function () {
                $('#sport').slideToggle(1000);
            })
            $('#animate').click(function () {
                $('img').css({
                    position: 'relative'
                });
                $('img').animate({
                    left:'200px',
                },3000, function() {
                    console.log('動畫1完成')
                }).animate({
                    opacity:0.5,
                    height: '50px',
                    width:'200px'
                },3000, function(){
                    console.log('動畫2完成')
                });
            })
        })
    </script>
</body>

</html>
